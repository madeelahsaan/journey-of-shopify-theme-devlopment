<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-cont">
        <div class="child child1">box1</div>
        <div class="child child2">box2 <br> align-content : baseline</div>
        <div class="child child3">box3 <br> flex-shrink : 2</div>
        <div class="child child4">box4 <br> align-content : flex-end</div>
        <div class="child child5">box5</div>
        <div class="child child6">box6</div>
        <div class="child child7">box7 <br> align-content : flex-start</div>
        <div class="child child8">box8 <br> order : 1</div>
        <div class="child child9">box9 <br> flex -grow : 2 </div>
        <div class="child child10">box10</div>
    </div>
</body>
</html>
