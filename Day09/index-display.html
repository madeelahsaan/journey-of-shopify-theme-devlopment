<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        .box {
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
        }

        .box-1 {
            width: 500px;
            display: inline;
            background-color: lightblue;
        }

        div.box-2 {
            /* width: 500px; */
            display: block;
            background-color: lightcoral;
        }

        div.box-3 {
            width: 500px;
            visibility: hidden;
            background-color: lightgray;
        }

        div.box-4 {
            width: 500px;
            display: inline-block;
            background-color: lightgreen;
        }

        div.box-5 {
            width: 500px;
            display: none;
            background-color: lightyellow;
        }

        div.box-6 {
            width: 500px;
            display: table;
            background-color: lightpink;
        }
    </style>
</head>

<body>
    <div class="box box-1">I am inline. top-padding & width dosen't work with display inline </div>
    <div class="box box-2">I am block</div>
    <div class="box box-3">I am visibility hidden</div>
    <div class="box box-4">I am inline-block </div>
    <div class="box box-5">I am none</div>
    <div class="box box-6">purpose of display: table is to create table-like layout behavior</div>
</body>

</html>
