<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 | Forms, Inline & Block Elements</title>
</head>
<body>
    <form action="post">
        <div>
            <lebel for="Name">Enter Full Name</lebel>
            <input type="text" name="Name" id="Name" placeholder="Enter Name">
        </div>
        <div>
            <label for="city">Enter City</label>
            <input type="text" name="city" id="city" placeholder="Enter your city name">
        </div>
        <div>
            <lable for="height">Enter Your Height</lable>
            <select name="height">
                <option value="4+">4+</option>
                <option value="5+">5+</option>
                <option value="6+">6+</option>
            </select>
        </div>
        <div>
            <label for="pincode">User pin</label>
            <input type="password" name="pincode" id="pincode" placerholder="Enter User Pincode">
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
