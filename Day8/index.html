<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .ma-container {
            max-width: 500px;
            border: 1px solid #ccc;
            padding: 50px;
        }

        .ma-main-cont {
            width: 100%;
            background-color: #8fd5f3;
            border-radius: 10px;
            box-shadow: 3px 7px 10px rgba(0, 0, 0, 0.592);
            padding: 20px;
        }
        .ma-cont{
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }
        .ma-cont .ma-head {
            width: 100%;
            height: 150px;
            background-color: rgb(85, 0, 128);
            display: flex;
            justify-content: center;
        }

        .ma-head-img {
            width: 150px;
            height: 150px;

        }

        .ma-head-img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .ma-body {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .ma-heading {
            font-size: 30px;
            font-weight: 600;
            color: #000;
            margin-bottom: 10px;
        }

        .ma-body .ma-subheading {
            font-size: 20px;
            font-weight: 600;
            color: gray;
            margin-bottom: 10px;
        }

        .ma-body .ma-bio {
            font-size: 16px;
            color: gray;
            margin-bottom: 20px;
        }

        .ma-body .ma-social-links {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            list-style: none;
        }

        .ma-social-links li a {
            /* border: 1px solid #000; */
            padding: 10px;
            border-radius: 50%;
            background-color: lightgray;
            color: #000;
            text-decoration: none;
        }

        .ma-foot {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ma-foot button {
            width: 100%;
            height: 40px;
            border: none;
            outline: none;
            background-color: rgb(85, 0, 128);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="ma-container">
        <div class="ma-main-cont">
            <div class="ma-cont">

                <div class="ma-head">
                    <div class="ma-head-img">
                        <img src="/Day1/images/hookle-app-6Pa7l0unTAY-unsplash.jpg" alt="profile">
                    </div>
                </div>

                <div class="ma-body">
                    <h2 class="ma-heading">Seu Nome</h2>
                    <h3 class="ma-subheading">Desenvolvedor Web</h3>
                    <p class="ma-bio">Breve descrição sobre você e suas habilidades. Lorem ipsum dolor sit amet,
                        consectetur
                        adipisicing elit. Aliquam architecto animi rerum?</p>

                    <ul class="ma-social-links">
                        <li><a href="#">IN</a></li>
                        <li><a href="#">GH</a></li>
                        <li><a href="#">Tw</a></li>
                        <li><a href="#">IG</a></li>
                    </ul>                        
                </div>
                <div class="ma-foot">
                    <button type="submit">Enter em contato</button>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
